[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent-arkode"
version = "0.1.0"
description = "Python-first daily job agent with human-in-the-loop approvals"
readme = "docs/README.md"
requires-python = ">=3.12"
authors = [{name = "job-agent-arkode"}]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "typer>=0.12.0",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4.0",
  "feedparser>=6.0.11",
  "jinja2>=3.1.4",
  "apscheduler>=3.10.4",
  "pyyaml>=6.0.2",
  "httpx>=0.27.2",
  "python-slugify>=8.0.4",
  "playwright>=1.47.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "types-PyYAML>=6.0.12.20240917"
]

[project.scripts]
jobagent = "src.cli.main:app"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
